name: build-arm64-image

on:
  push:
    branches: [ master ]
    tags: [ '*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-wvp-arm64:
    runs-on: ubuntu-24.04-arm 
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Build Backend
        run: mvn clean package -DskipTests

      - name: Build Frontend
        run: |
          cd ./web
          npm install
          npm run build:prod
          cd ../

      - name: Prepare build context
        run: |
          rm -rf build-context
          mkdir -p build-context
          cp ./target/*.jar build-context/wvp.jar
          cp -r ./src/main/resources/static build-context/static
          cp ./src/main/resources/application-dev.yml build-context/application.yml

      - name: Write Dockerfile
        run: |
          cat > build-context/Dockerfile << 'EOF'
          FROM eclipse-temurin:21-jre-jammy

          ENV TZ=Asia/Shanghai
          RUN ln -snf /usr/share/zoneinfo/$TZ /etc/localtime && echo $TZ > /etc/timezone

          WORKDIR /opt/wvp

          COPY wvp.jar /opt/wvp/wvp.jar
          COPY static /opt/wvp/static
          COPY application.yml /opt/wvp/application.yml

          EXPOSE 18080 5060 5060/udp

          ENTRYPOINT ["java", "-Xms512m", "-Xmx1024m", "-XX:+UseG1GC", "-jar", "/opt/wvp/wvp.jar"]
          EOF

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v5
        with:
          context: ./build-context
          file: ./build-context/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

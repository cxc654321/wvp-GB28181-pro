name: release-ubuntu-arm

on:
  push:
    branches: [ master ]
    tags: [ '*' ]

jobs:
  build-ubuntu-arm:
    runs-on: ubuntu-24.04-arm   # 官方 ARM64 runner，仅 public repo 可用
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release
        run: |
          rm -rf release
          mkdir release
          echo ${{ github.sha }} > Release.txt
          cp Release.txt LICENSE release/
          cat Release.txt

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: clean maven cache
        run: rm -rf ~/.m2/repository/io/github/git-commit-id

      - name: Build Backend
        run: |
          mvn clean package

      - name: Compile frontend
        run: |
          cd ./web
          npm install
          npm run build:prod
          cd ../

      - name: Package Files
        run: |
          cp -r ./src/main/resources/static release/
          cp ./target/*.jar release/
          cp ./src/main/resources/application-dev.yml release/application.yml

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            BRANCH_NAME="${{ github.event.repository.default_branch }}"
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            BRANCH_NAME="${GITHUB_REF_NAME}"
            TAG_NAME=""
          fi

          if [[ -z "$BRANCH_NAME" ]]; then
            BRANCH_NAME="${{ github.event.repository.default_branch }}"
          fi

          if [[ -n "$TAG_NAME" ]]; then
            ZIP_FILE_NAME="${BRANCH_NAME}-${TAG_NAME}.zip"
          else
            ZIP_FILE_NAME="${BRANCH_NAME}.zip"
          fi

          zip -r "$ZIP_FILE_NAME" release
          echo "ZIP_FILE_NAME=$ZIP_FILE_NAME" >> $GITHUB_ENV

      - name: Release-ARM64
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ZIP_FILE_NAME }}

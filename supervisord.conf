[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:mysql]
command=/usr/sbin/mysqld --user=root
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/mysql.log
stderr_logfile=/var/log/supervisor/mysql.err.log

[program:redis]
command=/usr/bin/redis-server /opt/polaris/redis/redis.conf --appendonly yes
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis.err.log

[program:zlm]
command=/opt/media/bin/MediaServer -c /opt/media/conf/config.ini
directory=/opt/media/bin
autostart=true
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/zlm.log
stderr_logfile=/var/log/supervisor/zlm.err.log

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=35
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx.err.log

[program:wvp]
command=java -Xms512m -Xmx1024m -XX:+UseG1GC -jar /opt/wvp/wvp.jar
directory=/opt/wvp
autostart=true
autorestart=true
priority=40
stdout_logfile=/var/log/supervisor/wvp.log
stderr_logfile=/var/log/supervisor/wvp.err.log
# 从 compose 的 polaris-wvp.environment 照搬，只把 polaris-* 改成 127.0.0.1
environment=
  TZ="Asia/Shanghai",
  RUN_ENV="docker",
  ZLM_HOOK_HOST="127.0.0.1",
  ZLM_HOST="127.0.0.1",
  ZLM_SERCERT="su6TiedN2rVAmBbIDX0aa0QTiBJLBdcf",
  MediaHttp="8080",
  MediaRtmp="10935",
  MediaRtsp="5540",
  MediaRtp="10000",
  REDIS_HOST="127.0.0.1",
  REDIS_PORT="6379",
  DATABASE_HOST="127.0.0.1",
  DATABASE_PORT="3306",
  DATABASE_USER="wvp_user",
  DATABASE_PASSWORD="wvp_password",
  SIP_Port="8116"